name: Build and Push to Docker Hub

# main publishes :latest. A tag vX.Y.Z publishes :X.Y.Z and leaves :latest alone.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# Per ref, so a release tag and a main push do not cancel each other.
concurrency:
  group: docker-hub-publish-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted runners (setup: docs/release.md, "CI runners"). Only pushes to main, tags and
# manual runs start this, never pull requests, so code from forks never sees the Docker Hub
# login.
jobs:
  build-amd64:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push amd64
        env:
          REPO: ${{ secrets.DOCKER_USERNAME }}/rift
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            if [ "$version" != "$crate" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
              exit 1
            fi
            tag="$version-amd64"
          else
            tag="amd64"
          fi
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if docker buildx build \
              --push \
              --platform linux/amd64 \
              --tag "$REPO:$tag" \
              --cache-from type=gha,scope=rift-amd64 \
              --cache-to type=gha,scope=rift-amd64,mode=max \
              --provenance=true \
              --sbom=true \
              .; then
              exit 0
            fi
            echo "amd64 build attempt ${attempt} failed" >&2
            attempt=$((attempt + 1))
            sleep 20
          done
          exit 1

  build-arm64:
    # Native arm64. QEMU emulation recompiles Rust for hours, and the layer
    # cache cannot skip that once src changes.
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push arm64
        env:
          REPO: ${{ secrets.DOCKER_USERNAME }}/rift
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            if [ "$version" != "$crate" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
              exit 1
            fi
            tag="$version-arm64"
          else
            tag="arm64"
          fi
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if docker buildx build \
              --push \
              --platform linux/arm64 \
              --tag "$REPO:$tag" \
              --cache-from type=gha,scope=rift-arm64 \
              --cache-to type=gha,scope=rift-arm64,mode=max \
              --provenance=true \
              --sbom=true \
              .; then
              exit 0
            fi
            echo "arm64 build attempt ${attempt} failed" >&2
            attempt=$((attempt + 1))
            sleep 20
          done
          exit 1

  merge:
    runs-on: [self-hosted, linux, x64]
    needs: [build-amd64, build-arm64]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish multi-arch tag
        env:
          REPO: ${{ secrets.DOCKER_USERNAME }}/rift
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            target="$version"
            suffix="$version-"
          else
            target=latest
            suffix=""
          fi
          docker buildx imagetools create \
            -t "$REPO:$target" \
            "$REPO:${suffix}amd64" \
            "$REPO:${suffix}arm64"
