name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job runs on self-hosted runners (labels below; setup: docs/release.md, "CI runners").
# Pull requests from forks never reach them: on a public repository anyone could otherwise run
# code on these machines. Fork pull requests are checked once a maintainer pushes them to a
# branch of this repository.
#
# The netns and Docker integration jobs change the host's network (sysctls, nftables, Docker's
# firewall rules) and run only on runners labelled `disposable`, and only when the repository
# variable RIFT_DISPOSABLE_RUNNER is `true`; without it they are skipped.

jobs:
  rust:
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  linux-netns:
    runs-on: [self-hosted, linux, x64, disposable]
    if: vars.RIFT_DISPOSABLE_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 wireguard-tools nftables iptables iperf3 curl conntrack openssl
      - run: cargo build --release
      - run: sudo env RIFT_NETNS_DISPOSABLE_VM=1 bash tests/netns/run.sh

  docker-bridge:
    runs-on: [self-hosted, linux, x64, disposable]
    if: vars.RIFT_DISPOSABLE_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: sudo env RIFT_DOCKER_BRIDGE_VM=1 bash tests/docker/bridge-smoke.sh
      - run: sudo apt-get update && sudo apt-get install -y iproute2 wireguard-tools nftables openssh-client openssl curl
      - run: sudo env RIFT_DOCKER_PUBLISHED_VM=1 bash tests/docker/published-port-e2e.sh

  licenses:
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-about@0.9.3 --locked --features cli
      # Fails on a dependency whose license is not in about.toml, and when
      # THIRD_PARTY_LICENSES.md no longer matches Cargo.lock.
      - run: cargo about generate --locked --fail about.hbs -o THIRD_PARTY_LICENSES.md
      - run: git diff --exit-code THIRD_PARTY_LICENSES.md

  site-helper:
    runs-on: [self-hosted, linux, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s deploy/vps -p 'test_*.py'
      - run: python3 tests/proxies/run.py
