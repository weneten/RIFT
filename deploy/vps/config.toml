# Copy this file as-is. The public address is RIFT_PUBLIC_IPS in .env, not a line in this file.
state_dir = "/var/lib/rift"
interface = "rift0"
wg_port = 51820
enrollment_bind = "0.0.0.0:8443"
# auto opens the enrollment port only while an invitation is open; always or off.
enrollment = "auto"
control_port = 8444
route_table = 51888
rule_priority = 11000
mark = 1380515840
mark_mask = 4294901760
mtu = 1380
# auto adds owned jumps in UFW user chains when those chains exist.
host_firewall = "auto"
