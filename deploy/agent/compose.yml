name: rift-agent

services:
  rift-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rift:local
    container_name: rift-agent
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=4m
    volumes:
      - rift-state:/var/lib/rift
      - ./config.toml:/etc/rift/config.toml:ro
    environment:
      RIFT_SERVER: ${RIFT_SERVER:?Set RIFT_SERVER=hostname:8443 in the root .env}
      RIFT_AGENT_NAME: ${RIFT_AGENT_NAME:?Set RIFT_AGENT_NAME in the root .env}
      RIFT_ENROLLMENT_TOKEN: ${RIFT_ENROLLMENT_TOKEN:-}
      RIFT_AGENT_ALLOW_PORTS: ${RIFT_AGENT_ALLOW_PORTS:-}
      RIFT_AGENT_ALLOW_SUBNETS: ${RIFT_AGENT_ALLOW_SUBNETS:-}
      RIFT_AGENT_ALLOW_EXIT: ${RIFT_AGENT_ALLOW_EXIT:-}
    command: ["--config", "/etc/rift/config.toml", "agent"]

volumes:
  rift-state:
