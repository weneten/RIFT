# Configuration for cargo-about, which writes THIRD_PARTY_LICENSES.md:
#   cargo about generate --locked --fail about.hbs -o THIRD_PARTY_LICENSES.md
# The list below is the set of licenses a dependency may use. A dependency under any other
# license makes the command fail, so a new license is reviewed before it ships.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what is compiled into the released binary on the published platforms.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Built-in clarifications for crates whose license files need them.
workarounds = ["ring", "rustls"]
