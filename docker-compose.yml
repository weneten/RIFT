# Once per host, before the first start: sudo sh deploy/prepare-host
# Published image for both roles. Copy the matching env example to .env.
# VPS: .env.server.example, then edit the endpoint and the public address.
# Home server: .env.agent.example, then paste the invitation lines.
# COMPOSE_PROFILES in that file starts only one of the services below.

name: rift

x-rift: &rift
  # RIFT_VERSION in .env pins a release, e.g. 1.0.0. Unset follows main (latest).
  image: weneten/rift:${RIFT_VERSION:-latest}
  network_mode: host
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  stop_grace_period: 60s
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
    - /run:rw,noexec,nosuid,size=4m
  volumes:
    - rift-state:/var/lib/rift
    - ${RIFT_CONFIG:-./config.toml}:/etc/rift/config.toml:ro

services:
  server:
    <<: *rift
    profiles: ["server"]
    container_name: rift-server
    volumes:
      - rift-state:/var/lib/rift
      - ${RIFT_CONFIG:-./config.toml}:/etc/rift/config.toml:ro
      # Web panel sites: the host helper's records (read-only) and the request queue the
      # host service answers. Created by deploy/install-cli; Docker creates them empty
      # otherwise, and the panel then says the host command is missing.
      - /var/lib/rift-site:/var/lib/rift-site:ro
      - /var/lib/rift-site-queue:/var/lib/rift-site-queue
    environment:
      RIFT_PUBLIC_ENDPOINT: ${RIFT_PUBLIC_ENDPOINT:-}
      RIFT_PUBLIC_IPS: ${RIFT_PUBLIC_IPS:-}
      RIFT_ENROLLMENT_BIND: ${RIFT_ENROLLMENT_BIND:-0.0.0.0:8443}
      RIFT_ENROLLMENT: ${RIFT_ENROLLMENT:-}
      RIFT_REQUEST_CERTIFICATE: ${RIFT_REQUEST_CERTIFICATE:-}
      RIFT_LETSENCRYPT_EMAIL: ${RIFT_LETSENCRYPT_EMAIL:-}
      RIFT_NPM_EMAIL: ${RIFT_NPM_EMAIL:-}
      RIFT_NPM_PASSWORD: ${RIFT_NPM_PASSWORD:-}
      RIFT_ALLOW_PRIVATE_LISTENERS: ${RIFT_ALLOW_PRIVATE_LISTENERS:-}
      RIFT_WG_PORT: ${RIFT_WG_PORT:-}
      RIFT_IPV4_POOL: ${RIFT_IPV4_POOL:-}
      RIFT_IPV6_POOL: ${RIFT_IPV6_POOL:-}
      RIFT_SERVER_IPV4: ${RIFT_SERVER_IPV4:-}
      RIFT_SERVER_IPV6: ${RIFT_SERVER_IPV6:-}
      RIFT_VPN_POOL: ${RIFT_VPN_POOL:-}
      RIFT_VPN_POOL6: ${RIFT_VPN_POOL6:-}
      RIFT_VPN_DNS: ${RIFT_VPN_DNS:-}
      RIFT_NAMES_PORT: ${RIFT_NAMES_PORT:-}
      RIFT_NAMES_SUFFIX: ${RIFT_NAMES_SUFFIX:-}
      RIFT_WEBPANEL: ${RIFT_WEBPANEL:-}
      RIFT_WEBPANEL_ACCESS: ${RIFT_WEBPANEL_ACCESS:-}
      RIFT_WEBPANEL_PORT: ${RIFT_WEBPANEL_PORT:-}
      RIFT_WEBPANEL_CONTROL: ${RIFT_WEBPANEL_CONTROL:-}
      RIFT_WEBPANEL_2FA: ${RIFT_WEBPANEL_2FA:-}
      RIFT_WEBPANEL_ALLOW: ${RIFT_WEBPANEL_ALLOW:-}
      RIFT_WEBPANEL_PROXIES: ${RIFT_WEBPANEL_PROXIES:-}
      RIFT_WEBPANEL_INSECURE: ${RIFT_WEBPANEL_INSECURE:-}
      RIFT_WEBPANEL_PASSWORD: ${RIFT_WEBPANEL_PASSWORD:-}
      RIFT_TUI: ${RIFT_TUI:-}
    command: ["--config", "/etc/rift/config.toml", "server"]
  agent:
    <<: *rift
    profiles: ["agent"]
    container_name: rift-agent
    volumes:
      - rift-state:/var/lib/rift
      - ${RIFT_CONFIG:-./config.toml}:/etc/rift/config.toml:ro
      # The names of linked agents for this host's resolver (rift-host-names). Created by
      # deploy/install-cli; Docker creates it empty otherwise, and the names then stay unused.
      - /var/lib/rift-agent-host:/var/lib/rift-agent-host
    environment:
      RIFT_SERVER: ${RIFT_SERVER:-}
      RIFT_AGENT_NAME: ${RIFT_AGENT_NAME:-}
      RIFT_ENROLLMENT_TOKEN: ${RIFT_ENROLLMENT_TOKEN:-}
      RIFT_AGENT_ALLOW_PORTS: ${RIFT_AGENT_ALLOW_PORTS:-}
      RIFT_AGENT_ALLOW_SUBNETS: ${RIFT_AGENT_ALLOW_SUBNETS:-}
      RIFT_AGENT_ALLOW_EXIT: ${RIFT_AGENT_ALLOW_EXIT:-}
      RIFT_AGENT_ALLOW_LINKS: ${RIFT_AGENT_ALLOW_LINKS:-}
      RIFT_NAMES_SUFFIX: ${RIFT_NAMES_SUFFIX:-}
      RIFT_TUI: ${RIFT_TUI:-}
    command: ["--config", "/etc/rift/config.toml", "agent"]

volumes:
  rift-state:
